name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'V[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Test, package, and publish Windows release
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python-backend/requirements-dev.txt

      - name: Validate release tag and source version
        shell: pwsh
        run: ./tool/package_windows.ps1 -Tag '${{ github.ref_name }}' -ValidateVersionOnly

      - name: Install dependencies
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          python -m pip install -r python-backend/requirements-dev.txt
          python -m pip check

      - name: Run Flutter quality gates
        shell: pwsh
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Run Python quality gates
        working-directory: python-backend
        shell: pwsh
        run: |
          python -m ruff check app tests
          python -m pytest

      - name: Build complete Windows package
        shell: pwsh
        run: ./tool/build_windows.ps1

      - name: Smoke test packaged backend
        shell: pwsh
        run: ./tool/smoke_test_windows_release.ps1 -ExpectedVersion '${{ github.ref_name }}'.Substring(1)

      - name: Create verified release archive
        id: package
        shell: pwsh
        run: ./tool/package_windows.ps1 -Tag '${{ github.ref_name }}'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: QingJuan-v${{ steps.package.outputs.version }}-windows-x64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $archive = '${{ steps.package.outputs.archive }}'
          $checksum = '${{ steps.package.outputs.checksum }}'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload $tag $archive $checksum --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $tag $archive $checksum --verify-tag --generate-notes --latest --title "青卷 $tag" --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publishing failed with exit code $LASTEXITCODE."
          }
