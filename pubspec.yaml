name: qingjuan
description: 青卷：支持 Windows 本机/远程与 Android 远程连接的 Flutter 阅读客户端。
publish_to: none
version: 1.7.2+23

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_tts: 4.2.5
  flutter_secure_storage: ^9.2.4
  file_selector: ^1.0.3
  fluent_ui: 4.9.2
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  window_manager: 0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # fluent_ui 4.9.x 内部仍引用部分 Material 图标字体。
  uses-material-design: true
  assets:
    - assets/logo.png
